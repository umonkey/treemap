; Local development email dispatcher configuration.
;
; Supervisor must not rotate Docker stdout/stderr streams.
; Rotating these streams can cause "OSError: Illegal seek".

[program:dispatch-emails]
command = bin/treemap dispatch-emails
directory = /app

; Keep the dispatcher running as in the existing environment.
autostart = true
autorestart = true

; Forward logs to Docker without Supervisor log rotation.
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0

stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0