# This workflow builds and pushes the video transcoder service image.
#
# The image is built and pushed as: ghcr.io/umonkey/treemap-transcoder:latest

name: Deploy Transcoder

on:
  push:
    branches:
      - master
    paths:
      - 'services/transcoder/**'
  pull_request:
    paths:
      - 'services/transcoder/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/transcoder
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: services/transcoder
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: ghcr.io/umonkey/treemap-transcoder:latest
          cache-from: |
            type=gha,scope=transcoder
            ghcr.io/umonkey/treemap-transcoder:latest
          cache-to: type=gha,mode=max,scope=transcoder
