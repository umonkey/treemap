name: "Backend tests"

on:
  pull_request:
    paths: 'services/backend/**'
  workflow_dispatch:

env:
  AWS_KEY: "secret"
  AWS_REGION: "fra1"
  AWS_SECRET: "secret"
  CARGO_TERM_COLOR: always
  JWT_SECRET: "dummy-secret-for-tests"
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"
  SMTP_HOST: "localhost"

jobs:
  linter:
    name: "Linter"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend

    steps:
    - uses: actions/checkout@v4

    - name: Cache target files
      uses: actions/cache@v4
      with:
        path: 'services/backend/target'
        key: ${{ runner.os }}-linter-${{ hashFiles('services/backend/Cargo.lock') }}

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    # Adds cache with some defaults, see https://github.com/marketplace/actions/rust-cache
    - uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: |
        cargo clippy
        cargo fmt --check

  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend

    steps:
    - uses: actions/checkout@v4

    - name: Cache target files
      uses: actions/cache@v4
      with:
        path: 'services/backend/target'
        key: ${{ runner.os }}-unit-${{ hashFiles('services/backend/Cargo.lock') }}

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    # Adds cache with some defaults, see https://github.com/marketplace/actions/rust-cache
    - uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: |
        mkdir -p var
        cargo test --verbose
