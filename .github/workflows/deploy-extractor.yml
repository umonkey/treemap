name: Deploy Extractor

on:
  push:
    branches:
      - master
    paths:
      - 'services/extractor/**'
  pull_request:
    paths:
      - 'services/extractor/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: services/extractor
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: ghcr.io/umonkey/treemap-extractor:latest
          cache-from: |
            type=gha,scope=extractor
            ghcr.io/umonkey/treemap-extractor:latest
          cache-to: type=gha,mode=max,scope=extractor
